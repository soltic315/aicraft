<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiCraft</title>
  <style>
    :root {
      --ui-scale: 1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    body.high-contrast { background: #000; }
    body.high-contrast #ui-root { filter: contrast(1.4) brightness(1.1); }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #ui-root {
      position: fixed;
      inset: 0;
      z-index: 10;
      transform-origin: 0 0;
      transform: scale(var(--ui-scale));
      width: calc(100% / var(--ui-scale));
      height: calc(100% / var(--ui-scale));
      pointer-events: none;
    }

    #start-screen,
    #settings-panel,
    #craft-panel,
    #chest-panel,
    #loading-screen {
      pointer-events: auto;
    }

    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    #crosshair::before {
      width: 2px; height: 20px;
      top: -10px; left: -1px;
    }
    #crosshair::after {
      width: 20px; height: 2px;
      top: -1px; left: -10px;
    }

    #hud {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 4px;
      z-index: 10;
      pointer-events: none;
    }
    .hotbar-slot {
      width: 52px; height: 52px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .hotbar-slot.active {
      border-color: #fff;
      background: rgba(255,255,255,0.15);
    }
    .hotbar-slot canvas {
      width: 40px; height: 40px;
      image-rendering: pixelated;
    }
    .hotbar-slot .slot-num {
      position: absolute;
      top: 2px; left: 4px;
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      font-family: monospace;
    }
    .hotbar-slot .slot-count {
      position: absolute;
      right: 4px;
      bottom: 2px;
      color: #fff;
      font-size: 11px;
      font-family: monospace;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
    }

    #info {
      position: fixed;
      top: 10px; left: 10px;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      line-height: 1.6;
    }

    #health-hud {
      position: fixed;
      top: 86px;
      left: 10px;
      width: 180px;
      padding: 7px 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #health-bar {
      width: 100%;
      height: 8px;
      margin-top: 4px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.55);
      border-radius: 999px;
      overflow: hidden;
    }
    #health-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f55f5f, #ff8a8a);
      transition: width 120ms ease;
    }

    #settings-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      width: min(280px, calc(100vw - 20px));
      background: rgba(10, 20, 32, 0.76);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 8px;
      padding: 10px 12px;
      color: #d7e7ff;
      font-family: monospace;
      font-size: 12px;
      z-index: 12;
      backdrop-filter: blur(3px);
      display: none;
    }
    #settings-panel h2 {
      font-size: 12px;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    #settings-panel .setting {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    #settings-panel label {
      color: rgba(235, 245, 255, 0.9);
    }
    #settings-panel input[type='range'] {
      width: 140px;
      accent-color: #7cc8ff;
    }
    #settings-panel .setting-value {
      min-width: 36px;
      text-align: right;
      color: #fff;
    }
    #settings-panel .setting-hint {
      margin-top: 4px;
      color: rgba(215, 231, 255, 0.78);
      font-size: 11px;
    }

    #craft-panel {
      position: fixed;
      top: 208px;
      right: 10px;
      width: min(300px, calc(100vw - 20px));
      background: rgba(30, 18, 8, 0.78);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffe3c2;
      font-family: monospace;
      font-size: 12px;
      z-index: 12;
      backdrop-filter: blur(3px);
      display: none;
    }
    #craft-panel h2 {
      font-size: 12px;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      color: #fff7e9;
    }
    #craft-list {
      display: grid;
      gap: 6px;
    }
    .craft-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
    }
    .craft-row button {
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .craft-row button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #craft-panel .craft-hint {
      margin-top: 8px;
      color: rgba(255, 228, 196, 0.8);
      font-size: 11px;
    }

    #chest-panel {
      position: fixed;
      top: 388px;
      right: 10px;
      width: min(340px, calc(100vw - 20px));
      background: rgba(32, 22, 8, 0.82);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffe4bc;
      font-family: monospace;
      font-size: 12px;
      z-index: 13;
      backdrop-filter: blur(3px);
      display: none;
    }
    #chest-panel h2 {
      font-size: 12px;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      color: #fff7e9;
    }
    .chest-panel-section {
      margin-bottom: 8px;
    }
    .chest-panel-title {
      margin-bottom: 4px;
      color: rgba(255, 240, 214, 0.86);
    }
    .chest-list {
      display: grid;
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .chest-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 7px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
    }
    .chest-row button {
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .chest-row button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #chest-panel .chest-hint {
      color: rgba(255, 228, 196, 0.8);
      font-size: 11px;
      margin-top: 2px;
    }

    #action-feedback {
      position: fixed;
      left: 50%;
      top: calc(50% + 42px);
      transform: translateX(-50%);
      z-index: 14;
      color: #fff3cf;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    #break-progress {
      position: fixed;
      left: 50%;
      top: calc(50% + 18px);
      transform: translateX(-50%);
      width: 140px;
      height: 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.45);
      overflow: hidden;
      z-index: 13;
      pointer-events: none;
      display: none;
    }
    #break-progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffcf7d, #ffdba0);
      transition: width 60ms linear;
    }

    #mobile-warning {
      margin-top: 16px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 208, 141, 0.5);
      border-radius: 6px;
      color: #ffd8a2;
      background: rgba(79, 41, 0, 0.35);
      font-size: 12px;
      text-align: center;
      display: none;
    }

    #resume-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 14px;
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    #water-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9;
      display: none;
      background: linear-gradient(
        to bottom,
        rgba(50, 110, 190, 0.25),
        rgba(20, 70, 150, 0.38)
      );
    }

    #start-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 120;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    .loading-spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #7cc8ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    #start-screen h1 {
      font-size: 64px;
      margin-bottom: 10px;
      letter-spacing: 4px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    }
    #start-screen p {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 40px;
    }
    #start-screen .start-btn {
      padding: 14px 48px;
      font-size: 20px;
      background: #4a8f4a;
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }
    #start-screen .start-btn:hover {
      background: #5ab05a;
    }
    #start-screen .controls {
      margin-top: 30px;
      font-size: 13px;
      color: #888;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
