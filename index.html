<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }

    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    #crosshair::before {
      width: 2px; height: 20px;
      top: -10px; left: -1px;
    }
    #crosshair::after {
      width: 20px; height: 2px;
      top: -1px; left: -10px;
    }

    #hud {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 4px;
      z-index: 10;
      pointer-events: none;
    }
    .hotbar-slot {
      width: 52px; height: 52px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .hotbar-slot.active {
      border-color: #fff;
      background: rgba(255,255,255,0.15);
    }
    .hotbar-slot canvas {
      width: 40px; height: 40px;
      image-rendering: pixelated;
    }
    .hotbar-slot .slot-num {
      position: absolute;
      top: 2px; left: 4px;
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      font-family: monospace;
    }

    #info {
      position: fixed;
      top: 10px; left: 10px;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      line-height: 1.6;
    }

    #start-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    #start-screen h1 {
      font-size: 64px;
      margin-bottom: 10px;
      letter-spacing: 4px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    }
    #start-screen p {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 40px;
    }
    #start-screen .start-btn {
      padding: 14px 48px;
      font-size: 20px;
      background: #4a8f4a;
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }
    #start-screen .start-btn:hover {
      background: #5ab05a;
    }
    #start-screen .controls {
      margin-top: 30px;
      font-size: 13px;
      color: #888;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>AiCraft</h1>
    <p>Minecraft風ブラウザゲーム</p>
    <button class="start-btn" id="start-btn">ゲーム開始</button>
    <div class="controls">
      WASD：移動　｜　スペース：ジャンプ　｜　Shift：降下<br>
      左クリック：ブロック破壊　｜　右クリック：ブロック設置<br>
      1-7：ブロック選択　｜　マウスホイール：ブロック切替<br>
      ESC：マウスロック解除
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="info"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
