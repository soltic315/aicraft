<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiCraft</title>
  <style>
    :root {
      --ui-scale: 1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    body.high-contrast { background: #000; }
    body.high-contrast #ui-root { filter: contrast(1.4) brightness(1.1); }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #ui-root {
      position: fixed;
      inset: 0;
      z-index: 10;
      transform-origin: 0 0;
      transform: scale(var(--ui-scale));
      width: calc(100% / var(--ui-scale));
      height: calc(100% / var(--ui-scale));
      pointer-events: none;
    }

    #start-screen,
    #death-screen,
    #settings-panel,
    #inventory-panel,
    #craft-panel-window,
    #furnace-panel-window,
    #chest-panel-modal,
    #loading-screen {
      pointer-events: auto;
    }

    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      width: 0; height: 0;
      transition: transform 0.08s ease;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.92);
      border-radius: 1px;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }
    #crosshair::before {
      width: 2px; height: 18px;
      top: -9px; left: -1px;
    }
    #crosshair::after {
      width: 18px; height: 2px;
      top: -1px; left: -9px;
    }
    /* 中央のドット */
    #crosshair-dot {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      pointer-events: none;
      z-index: 10;
    }

    #hud {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      z-index: 10;
      pointer-events: none;
    }
    #hotbar-slots {
      display: flex; gap: 3px;
    }
    #hotbar-item-name {
      color: #fff;
      font-family: 'Segoe UI', monospace, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 3px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.6);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 3px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none;
    }
    .hotbar-slot {
      width: 54px; height: 54px;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      border-radius: 4px;
      transition: border-color 0.1s, background 0.1s, box-shadow 0.1s;
    }
    .hotbar-slot.active {
      border-color: rgba(255,255,255,0.95);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .hotbar-slot.hotbar-drop-target {
      border-color: #7cc8ff;
      background: rgba(100,180,255,0.25);
    }
    .hotbar-slot canvas {
      width: 40px; height: 40px;
      image-rendering: pixelated;
    }
    .hotbar-slot .slot-num {
      position: absolute;
      top: 2px; left: 4px;
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      font-family: monospace;
    }
    .hotbar-slot .slot-count {
      position: absolute;
      right: 4px;
      bottom: 2px;
      color: #fff;
      font-size: 11px;
      font-family: monospace;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
    }
    .slot-durability-wrap {
      position: absolute;
      bottom: 3px;
      left: 3px;
      right: 3px;
      height: 3px;
      background: rgba(0,0,0,0.5);
      border-radius: 1px;
    }
    .slot-durability-bar {
      height: 100%;
      border-radius: 1px;
      transition: width 0.15s, background 0.15s;
    }

    #key-hints {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
      pointer-events: auto;
    }
    .key-hint-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      cursor: pointer;
      transition: background 100ms, border-color 100ms;
      white-space: nowrap;
      pointer-events: auto;
    }
    .key-hint-btn:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.45);
    }
    .key-hint-icon {
      font-size: 13px;
      line-height: 1;
    }
    .key-hint-label {
      font-family: monospace;
      font-size: 11px;
      flex: 1;
    }
    .key-hint-key {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 3px;
      color: #fff;
      font-family: monospace;
      font-size: 10px;
      padding: 1px 4px;
      min-width: 26px;
      text-align: center;
    }

    #info {
      position: fixed;
      top: 10px; left: 10px;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      line-height: 1.6;
    }

    /* ===== 左下ステータスHUD ===== */
    #stats-hud {
      position: fixed;
      bottom: 20px;
      left: 10px;
      width: 186px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
      pointer-events: none;
    }
    .stat-bar-row {
      padding: 7px 10px;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
      font-family: 'Segoe UI', monospace, sans-serif;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,1);
    }
    .stat-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 10px;
      letter-spacing: 1px;
      opacity: 0.8;
    }
    .stat-label-hp     { color: #ff9090; }
    .stat-label-hunger { color: #f0c858; }
    .stat-label-xp     { color: #80f070; }
    .stat-value {
      font-size: 11px;
      color: rgba(220,230,255,0.85);
    }
    .stat-bar {
      width: 100%;
      height: 7px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.6);
      border-radius: 999px;
      overflow: hidden;
    }
    .stat-fill {
      height: 100%;
      transition: width 150ms ease;
      border-radius: 999px;
    }
    .stat-fill-hp     { background: linear-gradient(90deg, #cc3030, #ff5555); box-shadow: 0 0 6px rgba(255,80,80,0.4); width: 100%; }
    .stat-fill-hunger { background: linear-gradient(90deg, #d4a830, #f0c858); box-shadow: 0 0 6px rgba(220,180,30,0.4); width: 100%; }
    .stat-fill-xp     { background: linear-gradient(90deg, #3ddc56, #80f070); box-shadow: 0 0 5px rgba(80,255,80,0.3);  width: 0%; }
    .stat-damaged {
      animation: statDamage 0.3s ease;
    }
    @keyframes statDamage {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    #settings-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(320px, calc(100vw - 20px));
      background: rgba(18, 22, 36, 0.97);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      padding: 14px;
      color: #e8eeff;
      font-family: monospace;
      font-size: 12px;
      z-index: 15;
      backdrop-filter: blur(5px);
      user-select: none;
    }
    #settings-panel .setting {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    #settings-panel label {
      color: rgba(190, 210, 255, 0.9);
    }
    #settings-panel input[type='range'] {
      width: 140px;
      accent-color: #7cc8ff;
    }
    #settings-panel .setting-value {
      min-width: 36px;
      text-align: right;
      color: #e8eeff;
    }
    #settings-panel .setting-difficulty {
      grid-template-columns: 1fr;
      gap: 4px;
    }
    #settings-panel .difficulty-setting-buttons {
      display: flex;
      gap: 6px;
    }
    .diff-setting-btn {
      flex: 1;
      padding: 5px 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: #d0e8ff;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .diff-setting-btn:hover {
      background: rgba(255,255,255,0.12);
    }
    .diff-setting-btn.active {
      background: rgba(100,160,255,0.25);
      border-color: #7cc8ff;
      color: #fff;
    }

    #craft-panel {
      position: fixed;
      top: 208px;
      right: 10px;
      width: min(300px, calc(100vw - 20px));
      background: rgba(30, 18, 8, 0.78);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffe3c2;
      font-family: monospace;
      font-size: 12px;
      z-index: 12;
      backdrop-filter: blur(3px);
      display: none;
    }
    #craft-panel h2 {
      font-size: 12px;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      color: #fff7e9;
    }
    #craft-list {
      display: grid;
      gap: 6px;
    }
    .craft-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
    }
    .craft-row button {
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .craft-row button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #craft-panel .craft-hint {
      margin-top: 8px;
      color: rgba(255, 228, 196, 0.8);
      font-size: 11px;
    }

    #chest-panel-modal {
      left: calc(50% + 8px);
      width: min(340px, calc(50vw - 16px));
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(18, 22, 36, 0.97);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      padding: 14px;
      color: #e8eeff;
      font-family: monospace;
      font-size: 12px;
      z-index: 15;
      backdrop-filter: blur(5px);
      user-select: none;
      pointer-events: auto;
    }
    #chest-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      min-height: 80px;
      padding: 6px;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 6px;
      background: rgba(0,0,0,0.15);
      margin-bottom: 8px;
    }
    #chest-inv-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .chest-empty-hint {
      grid-column: 1 / -1;
      text-align: center;
      color: rgba(190,210,255,0.35);
      font-size: 11px;
      padding: 16px 0;
    }

    #action-feedback {
      position: fixed;
      left: 50%;
      top: calc(50% + 42px);
      transform: translateX(-50%);
      z-index: 14;
      color: #fff3cf;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    #break-progress {
      position: fixed;
      left: 50%;
      top: calc(50% + 18px);
      transform: translateX(-50%);
      width: 140px;
      height: 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.45);
      overflow: hidden;
      z-index: 13;
      pointer-events: none;
      display: none;
    }
    #break-progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffcf7d, #ffdba0);
      transition: width 60ms linear;
    }

    #mobile-warning {
      margin-top: 16px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 208, 141, 0.5);
      border-radius: 6px;
      color: #ffd8a2;
      background: rgba(79, 41, 0, 0.35);
      font-size: 12px;
      text-align: center;
      display: none;
    }

    #resume-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 24px 32px;
      z-index: 20;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      border-radius: 8px;
    }

    #resume-hint-label {
      margin: 0;
      font-size: 18px;
      letter-spacing: 2px;
      color: #e0e0e0;
    }

    #resume-btn {
      padding: 10px 28px;
      background: #4a8f3f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: monospace;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    #resume-btn:hover {
      background: #5cae50;
    }

    /* 常時表示のビネット（周辺光量落ち）*/
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(
        ellipse at 50% 50%,
        transparent 55%,
        rgba(0,0,0,0.42) 100%
      );
    }

    #water-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9;
      display: none;
      background: linear-gradient(
        to bottom,
        rgba(20, 80, 170, 0.30),
        rgba(10, 50, 130, 0.50)
      );
      backdrop-filter: blur(1px) saturate(1.3);
    }

    #hit-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 11;
      background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(220, 0, 0, 0.65) 100%
      );
      animation: hitFlash 0.45s ease-out forwards;
    }

    @keyframes hitFlash {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    #start-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(160deg, rgba(8,14,30,0.96) 0%, rgba(18,28,60,0.96) 50%, rgba(8,20,10,0.96) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow-y: auto;
    }

    #start-screen-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 32px 16px;
      max-width: 640px;
      width: 100%;
    }

    #death-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(80, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 110;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    #death-title {
      font-size: 72px;
      color: #ff4444;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.7), 3px 3px 6px rgba(0,0,0,0.8);
      margin-bottom: 12px;
      letter-spacing: 4px;
    }
    #death-message {
      font-size: 18px;
      color: #ffaaaa;
      margin-bottom: 40px;
    }
    .respawn-btn {
      padding: 14px 48px;
      font-size: 20px;
      background: #8b2222;
      color: #fff;
      border: 2px solid #ff6666;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    .respawn-btn:hover {
      background: #b03030;
    }

    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 120;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    .loading-spinner {
      width: 52px;
      height: 52px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #7cc8ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .loading-logo {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(124,200,255,0.5), 2px 2px 6px rgba(0,0,0,0.8);
      margin-bottom: 28px;
    }
    .loading-progress-bar-outer {
      width: 320px;
      height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
      margin-top: 14px;
      overflow: hidden;
    }
    .loading-progress-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #4a9eff, #7cc8ff);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .loading-progress-pct {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .loading-tip {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(480px, 90vw);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .loading-tip-label {
      font-size: 11px;
      font-weight: 700;
      color: #7cc8ff;
      letter-spacing: 1px;
      white-space: nowrap;
      padding-top: 1px;
    }
    .loading-tip-text {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
    }
    #game-title {
      font-size: 72px;
      margin-bottom: 8px;
      letter-spacing: 6px;
      text-shadow: 0 0 30px rgba(124, 200, 255, 0.4), 3px 3px 10px rgba(0,0,0,0.8);
      font-weight: 700;
    }
    #game-version {
      font-size: 14px;
      color: rgba(180,210,255,0.5);
      letter-spacing: 2px;
      vertical-align: super;
      font-weight: 400;
      margin-left: 8px;
    }
    #game-subtitle {
      font-size: 15px;
      color: rgba(180,200,255,0.6);
      margin-bottom: 32px;
      letter-spacing: 1px;
    }

    /* 難易度選択 */
    #difficulty-section {
      width: 100%;
      margin-bottom: 28px;
    }
    #difficulty-label {
      font-size: 12px;
      color: rgba(180,210,255,0.55);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }
    #difficulty-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .difficulty-btn {
      flex: 1;
      min-width: 140px;
      max-width: 180px;
      padding: 12px 10px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .difficulty-btn:hover {
      transform: translateY(-2px);
    }
    .difficulty-btn.active {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .diff-label {
      font-size: 16px;
      font-weight: 600;

    /* ===== 実績トースト ===== */

      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 3px 10px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.5);

      font-size: 11px;

    #tutorial-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #tutorial-step-count {
      font-size: 11px;
      color: rgba(150,170,200,0.6);
      font-family: monospace;

    #tutorial-buttons {

      gap: 8px;

    #enchant-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(360px, 95vw);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: rgba(8, 12, 28, 0.97);
      border: 1px solid rgba(160,120,255,0.4);
      border-radius: 12px;
      padding: 16px;
      color: #e0d8ff;
      font-family: monospace;
      font-size: 12px;
      z-index: 20;
      backdrop-filter: blur(8px);
      pointer-events: auto;
      box-shadow: 0 0 40px rgba(100,60,200,0.2), 0 8px 32px rgba(0,0,0,0.7);
      animation: enchantOpen 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes enchantOpen {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .enchant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

      font-size: 15px;
      font-weight: bold;
      color: #c8a8ff;
      letter-spacing: 1px;

      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      border-radius: 4px;

      padding: 2px 8px;
      font-size: 12px;
    }
    .panel-close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .enchant-xp-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(80,240,80,0.25);
      border-radius: 6px;
      padding: 5px 10px;
      margin-bottom: 12px;
    }
    .enchant-xp-label {
      font-size: 11px;
      color: rgba(130,240,100,0.8);
    }
    .enchant-xp-value {
      font-size: 13px;
      color: #80f070;
      font-weight: bold;
    }
    .enchant-empty {
      text-align: center;
      color: rgba(200,200,255,0.4);

    .enchant-current-item {
      font-size: 12px;
      color: rgba(200,200,255,0.8);
      margin-bottom: 8px;
      padding: 6px 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 5px;
    }
    .enchant-current-item strong { color: #fff; }
    .enchant-current-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }
    .enchant-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      background: rgba(0,0,0,0.3);
    }
    .enchant-level {
      color: rgba(255,255,255,0.6);
      font-size: 10px;
    }
    .enchant-section-title {
      font-size: 10px;
      color: rgba(160,140,220,0.7);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      margin-top: 4px;
    }
    .enchant-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .enchant-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      background: rgba(0,0,0,0.2);
    }
    .enchant-row-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .enchant-icon { font-size: 15px; }
    .enchant-name {
      font-size: 12px;
      color: #e0d8ff;
    }
    .enchant-current-lv {
      font-size: 10px;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(0,0,0,0.3);
    }
    .enchant-level-btns {
      display: flex;
      gap: 4px;
    }
    .enchant-lv-btn {
      background: rgba(100,80,180,0.25);
      border: 1px solid rgba(160,120,255,0.3);
      border-radius: 4px;
      color: #c8a8ff;
      font-family: monospace;
      font-size: 10px;
      padding: 3px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      transition: background 0.1s, transform 0.1s;
    }
    .enchant-lv-btn:hover {
      background: rgba(130,100,220,0.45);
      transform: translateY(-1px);
    }
    .enchant-lv-btn.active {
      background: rgba(130,100,220,0.7);
      color: #fff;
    }
    .enchant-lv-btn.unaffordable {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .enchant-cost {
      color: rgba(130,240,100,0.7);
      font-size: 9px;
    }
    .enchant-feedback {
      margin-top: 10px;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    .enchant-feedback.success {
      background: rgba(40,120,40,0.5);
      border: 1px solid rgba(80,200,80,0.4);
      color: #90ff90;
    }
    .enchant-feedback.error {
      background: rgba(120,40,40,0.5);
      border: 1px solid rgba(200,80,80,0.4);
      color: #ff9090;
    }
